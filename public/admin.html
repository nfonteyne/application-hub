<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Application Hub</title>
<script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="app-header">
  <nav id="main-nav"></nav>
</header>
<main>
  <h1 data-i18n="admin.title">Administration</h1>
  <p class="page-subtitle" data-i18n="admin.subtitle">Ajoutez, modifiez ou retirez les applications listées sur le hub, et organisez-les par catégorie.</p>
  <div id="error"></div>

  <div class="section-header">
    <h2 style="margin:0" data-i18n="admin.appsHeading">Applications</h2>
    <button type="button" id="toggle-add-app" data-i18n="admin.addApp">+ Ajouter une application</button>
  </div>

  <div class="panel" id="add-app-panel" style="display:none">
    <form id="add-app-form" class="stacked-form">
      <input type="hidden" name="id">
      <label><span data-i18n="admin.form.name">Nom</span> <input name="name" required></label>
      <label><span data-i18n="admin.form.description">Description</span> <input name="description"></label>
      <label><span data-i18n="admin.form.url">URL</span> <input name="url" type="url" required placeholder="https://..."></label>
      <div class="form-row">
        <label><span data-i18n="admin.form.icon">Icône (emoji) ou URL d'image externe</span> <input name="icon" placeholder="🚀"></label>
        <label><span data-i18n="admin.form.requiredGroup">Groupe Authentik requis</span> <input name="requiredGroup" data-i18n-placeholder="admin.form.requiredGroupPlaceholder" placeholder="laisser vide = visible par tous"></label>
      </div>
      <div class="form-row">
        <label><span data-i18n="admin.form.category">Catégorie</span>
          <select name="categoryId" id="app-category-select">
            <option value="" data-i18n="admin.form.noCategory">Aucune catégorie</option>
          </select>
        </label>
        <label><span data-i18n="admin.form.position">Position</span> <input name="position" type="number" value="0"></label>
      </div>
      <label><span data-i18n="admin.form.logo">Logo téléversé (prioritaire sur le champ icône/URL ci-dessus)</span>
        <input name="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
      </label>
      <div class="current-logo" id="current-logo-wrap" style="display:none">
        <img id="current-logo-img" data-i18n-alt="admin.form.currentLogoAlt" alt="Logo actuel">
        <button type="button" class="secondary" id="remove-logo-btn" data-i18n="admin.form.removeLogo">Supprimer le logo actuel</button>
      </div>
      <div class="form-row">
        <button type="submit" id="app-form-submit" data-i18n="admin.form.add">Ajouter</button>
        <button type="button" class="secondary" id="cancel-app-form" data-i18n="admin.form.cancel">Annuler</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <table class="data-table">
      <thead>
        <tr>
          <th data-i18n="admin.table.name">Nom</th>
          <th data-i18n="admin.table.url">URL</th>
          <th data-i18n="admin.table.category">Catégorie</th>
          <th data-i18n="admin.table.requiredGroup">Groupe requis</th>
          <th data-i18n="admin.table.position">Position</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="apps-table-body"></tbody>
    </table>
    <p class="empty" id="apps-empty" style="display:none" data-i18n="admin.apps.empty">Aucune application pour le moment.</p>
  </div>

  <div class="section-header">
    <h2 style="margin:0" data-i18n="admin.categoriesHeading">Catégories</h2>
    <button type="button" id="toggle-add-category" data-i18n="admin.addCategory">+ Ajouter une catégorie</button>
  </div>

  <div class="panel" id="add-category-panel" style="display:none">
    <form id="add-category-form" class="stacked-form">
      <input type="hidden" name="id">
      <div class="form-row">
        <label><span data-i18n="admin.form.name">Nom</span> <input name="name" required></label>
        <label><span data-i18n="admin.form.position">Position</span> <input name="position" type="number" value="0"></label>
      </div>
      <div class="form-row">
        <button type="submit" id="category-form-submit" data-i18n="admin.form.add">Ajouter</button>
        <button type="button" class="secondary" id="cancel-category-form" data-i18n="admin.form.cancel">Annuler</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <table class="data-table">
      <thead>
        <tr>
          <th data-i18n="admin.table.name">Nom</th>
          <th data-i18n="admin.table.position">Position</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="categories-table-body"></tbody>
    </table>
    <p class="empty" id="categories-empty" style="display:none" data-i18n="admin.categories.empty">Aucune catégorie pour le moment.</p>
  </div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/render.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
